<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antique Match-3 Grid (8x8)</title>
  <style>
    :root {
      --board-size: 8;
      --cell-size: 56px;
      --gap-size: 6px;
      --board-bg: #3a2418;
      --board-inlay: #5c3a22;
      --page-bg: #1f130d;
      --tile-bg: #ead0a0;
      --tile-border: #a97838;
      --text-color: #fff7e8;
      --muted-text: #d8c09d;
      --brass: #c9943a;
      --dark-brass: #735022;
      --highlight-color: #ffd36a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 12%, rgba(255, 206, 124, 0.2), transparent 28rem),
        radial-gradient(circle at 12% 22%, rgba(199, 143, 62, 0.14), transparent 18rem),
        linear-gradient(90deg, rgba(255, 236, 181, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 236, 181, 0.025) 1px, transparent 1px),
        linear-gradient(135deg, #160d09 0%, var(--page-bg) 48%, #332015 100%);
      background-size: auto, auto, 72px 72px, 72px 72px, auto;
      color: var(--text-color);
      font-family: Georgia, 'Times New Roman', serif;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(90deg, rgba(92, 57, 33, 0.22) 0 2px, transparent 2px 96px),
        linear-gradient(rgba(0, 0, 0, 0.18), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.46));
      mix-blend-mode: screen;
      opacity: 0.55;
    }

    body::after {
      background: radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
    }

    .wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      width: min(100%, 620px);
      padding: 28px 20px;
    }

    h1 {
      margin: 0 0 8px;
      color: #ffe3a6;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      letter-spacing: 0.06em;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.65), 0 0 24px rgba(255, 192, 93, 0.3);
    }

    p {
      margin: 0 0 18px;
      color: var(--muted-text);
      opacity: 0.95;
    }

    .instructions {
      font-size: 1rem;
    }

    .game-panel {
      margin: 0 auto;
      padding: 18px;
      border: 1px solid rgba(219, 171, 92, 0.35);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(86, 53, 30, 0.92), rgba(43, 25, 16, 0.94)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 24px);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.58),
        inset 0 1px 0 rgba(255, 232, 178, 0.14),
        inset 0 -18px 38px rgba(0, 0, 0, 0.22);
    }

    .game-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 16px;
    }

    .scoreboard {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 10px 18px;
      border: 1px solid rgba(255, 215, 128, 0.42);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(73, 45, 26, 0.94), rgba(35, 22, 15, 0.96));
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 242, 201, 0.18);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-label {
      opacity: 0.82;
    }

    .score-value {
      min-width: 4ch;
      text-align: left;
      color: var(--highlight-color);
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.4);
    }

    .new-game-button {
      appearance: none;
      border: 1px solid rgba(255, 226, 157, 0.55);
      border-radius: 999px;
      padding: 10px 18px;
      background:
        linear-gradient(180deg, #e0b35e, var(--brass) 50%, #8f6327),
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.48), transparent 36%);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 244, 198, 0.72),
        inset 0 -3px 0 rgba(80, 48, 19, 0.34);
      color: #2f1d12;
      cursor: pointer;
      font: 700 1rem/1 Georgia, 'Times New Roman', serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }

    .new-game-button:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(255, 202, 98, 0.18),
        inset 0 1px 0 rgba(255, 244, 198, 0.72),
        inset 0 -3px 0 rgba(80, 48, 19, 0.34);
    }

    .new-game-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--board-size), var(--cell-size));
      grid-template-rows: repeat(var(--board-size), var(--cell-size));
      gap: var(--gap-size);
      width: max-content;
      margin: 0 auto;
      padding: 16px;
      border: 10px solid #2b190f;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 205, 121, 0.18), transparent 58%),
        linear-gradient(145deg, var(--board-inlay), var(--board-bg));
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.52),
        0 0 34px rgba(230, 157, 65, 0.14),
        inset 0 0 0 2px var(--dark-brass),
        inset 0 0 34px rgba(0, 0, 0, 0.44);
    }

    .tile {
      appearance: none;
      border-radius: 8px;
      display: grid;
      place-items: center;
      border: 2px solid var(--tile-border);
      background:
        radial-gradient(circle at 34% 24%, rgba(255, 245, 215, 0.78), transparent 28%),
        linear-gradient(145deg, #f2dcac, var(--tile-bg) 52%, #c79a5b);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.48),
        inset 0 -5px 0 rgba(91, 55, 25, 0.28),
        0 5px 12px rgba(0, 0, 0, 0.38);
      cursor: pointer;
      opacity: 1;
      padding: 0;
      font-size: 2rem;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      transition:
        transform 160ms ease,
        opacity 160ms ease,
        border-color 120ms ease,
        box-shadow 120ms ease;
    }

    .tile.is-swapping {
      pointer-events: none;
      transition: transform 220ms ease-in-out, border-color 120ms ease, box-shadow 120ms ease;
      z-index: 1;
    }

    .tile.is-falling {
      pointer-events: none;
      transition: transform 260ms ease-in, opacity 160ms ease;
      z-index: 1;
    }

    .tile.is-empty {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      cursor: default;
      opacity: 0;
    }

    .tile:hover:not(.is-empty) {
      transform: scale(1.03);
    }

    .tile.selected,
    .tile.matched {
      border-color: var(--highlight-color);
      box-shadow:
        0 0 0 2px rgba(255, 240, 184, 0.5),
        0 0 22px rgba(255, 205, 98, 0.42);
    }

    .tile.matched {
      opacity: 0.2;
      transform: scale(0.78);
    }

    .tile.selected {
      transform: scale(1.08);
    }

    @media (max-width: 560px) {
      :root {
        --cell-size: 40px;
        --gap-size: 4px;
      }

      .wrapper {
        padding-inline: 12px;
      }

      .game-panel {
        padding: 12px;
      }

      .board {
        padding: 10px;
        border-width: 7px;
      }

      .tile {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <h1>Antique Match-3</h1>
    <p class="instructions">Click one antique tile, then click a neighboring tile to swap pieces.</p>
    <div class="game-panel">
      <div class="game-controls">
        <button id="new-game" class="new-game-button" type="button">New Game</button>
        <div class="scoreboard" aria-live="polite">
          <span class="score-label">Score</span>
          <span id="score" class="score-value">0</span>
        </div>
      </div>
      <section id="board" class="board" aria-label="8 by 8 match-3 board"></section>
    </div>
  </main>

  <script>
    // Board settings.
    const BOARD_SIZE = 8;
    const MATCH_REMOVE_DELAY = 260;
    const FALL_ANIMATION_DURATION = 280;
    const SWAP_ANIMATION_DURATION = 220;
    const INVALID_SWAP_RETURN_DELAY = 260;

    // Antique-themed tile set used for matching and refilling the board.
    const ANTIQUE_TILES = [
      { id: 'key', emoji: '🗝️', label: 'key' },
      { id: 'lamp', emoji: '🪔', label: 'antique lamp' },
      { id: 'clock', emoji: '⏰', label: 'old clock' },
      { id: 'radio', emoji: '📻', label: 'old radio' },
      { id: 'gem', emoji: '💎', label: 'gem' },
      { id: 'vase', emoji: '🏺', label: 'vase' }
    ];

    const board = document.getElementById('board');
    const scoreDisplay = document.getElementById('score');
    const newGameButton = document.getElementById('new-game');
    const tileStep = getTileStepSize();
    let selectedTile = null;
    let isBoardBusy = false;
    let score = 0;

    // Build the interactive grid once; new games reuse these cells with fresh tile types.
    createBoardCells();

    function getTileStepSize() {
      const styles = getComputedStyle(document.documentElement);
      const cellSize = Number.parseFloat(styles.getPropertyValue('--cell-size'));
      const gapSize = Number.parseFloat(styles.getPropertyValue('--gap-size'));

      return cellSize + gapSize;
    }

    function getRandomTileType() {
      return ANTIQUE_TILES[Math.floor(Math.random() * ANTIQUE_TILES.length)];
    }

    function getTileTypeById(tileTypeId) {
      return ANTIQUE_TILES.find((tileType) => tileType.id === tileTypeId);
    }

    // Keep the opening board playable by avoiding automatic matches before the
    // player makes a swap. Refills still use fully random tiles so cascades can happen.
    function getRandomStartingTileType(row, col) {
      const choices = [...ANTIQUE_TILES].sort(() => Math.random() - 0.5);

      return choices.find((tileType) => !wouldCreateStartingMatch(row, col, tileType.id)) || getRandomTileType();
    }

    function wouldCreateStartingMatch(row, col, tileTypeId) {
      const leftOne = col >= 1 ? getTileType(getTileAt(row, col - 1)) : '';
      const leftTwo = col >= 2 ? getTileType(getTileAt(row, col - 2)) : '';
      const upOne = row >= 1 ? getTileType(getTileAt(row - 1, col)) : '';
      const upTwo = row >= 2 ? getTileType(getTileAt(row - 2, col)) : '';

      return (leftOne === tileTypeId && leftTwo === tileTypeId) || (upOne === tileTypeId && upTwo === tileTypeId);
    }

    function wait(milliseconds) {
      return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
    }

    function createBoardCells() {
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          const tile = document.createElement('button');

          tile.className = 'tile';
          tile.type = 'button';
          tile.setAttribute('data-row', row);
          tile.setAttribute('data-col', col);

          board.appendChild(tile);
        }
      }
    }

    function addScore(tilesRemoved) {
      score += tilesRemoved * 10;
      updateScoreDisplay();
    }

    function resetScore() {
      score = 0;
      updateScoreDisplay();
    }

    function updateScoreDisplay() {
      scoreDisplay.textContent = score;
    }

    function setControlsDisabled(isDisabled) {
      newGameButton.disabled = isDisabled;
    }

    // Fill every board cell with a fresh random layout that avoids pre-made matches.
    function generateFreshBoard() {
      clearSelection();
      board.querySelectorAll('.tile').forEach((tile) => {
        tile.classList.remove('matched', 'selected', 'is-swapping', 'is-falling');
        tile.style.transform = '';
        setTileType(tile, getRandomStartingTileType(Number(tile.dataset.row), Number(tile.dataset.col)));
      });
    }

    async function startNewGame() {
      if (isBoardBusy) {
        return;
      }

      isBoardBusy = true;
      setControlsDisabled(true);

      try {
        resetScore();
        generateFreshBoard();
        await settleBoard();
      } finally {
        setControlsDisabled(false);
        isBoardBusy = false;
      }
    }

    // Read a tile's fixed board position from its data attributes.
    function getTilePosition(tile) {
      return {
        row: Number(tile.dataset.row),
        col: Number(tile.dataset.col)
      };
    }

    // Match-3 swaps only move one tile up, down, left, or right.
    function areTilesAdjacent(firstTile, secondTile) {
      const first = getTilePosition(firstTile);
      const second = getTilePosition(secondTile);
      const rowDistance = Math.abs(first.row - second.row);
      const colDistance = Math.abs(first.col - second.col);

      return rowDistance + colDistance === 1;
    }

    function selectTile(tile) {
      clearSelection();
      tile.classList.add('selected');
      selectedTile = tile;
    }

    function clearSelection() {
      if (selectedTile) {
        selectedTile.classList.remove('selected');
      }

      selectedTile = null;
    }

    function getTileAt(row, col) {
      return board.querySelector(`[data-row="${row}"][data-col="${col}"]`);
    }

    function getTileType(tile) {
      return tile.dataset.tileType || '';
    }

    function setTileType(tile, tileType) {
      tile.dataset.tileType = tileType.id;
      tile.textContent = tileType.emoji;
      tile.setAttribute('aria-label', `${tileType.label} tile at row ${Number(tile.dataset.row) + 1}, column ${Number(tile.dataset.col) + 1}`);
      tile.classList.remove('is-empty');
      tile.disabled = false;
    }

    function clearTile(tile) {
      tile.dataset.tileType = '';
      tile.textContent = '';
      tile.setAttribute('aria-label', `Empty tile at row ${Number(tile.dataset.row) + 1}, column ${Number(tile.dataset.col) + 1}`);
      tile.classList.add('is-empty');
      tile.disabled = true;
    }

    function markMatchingRun(matches, tiles) {
      tiles.forEach((tile) => matches.add(tile));
    }

    // Find every horizontal and vertical run of at least three matching antique tiles.
    function findMatches() {
      const matches = new Set();

      for (let row = 0; row < BOARD_SIZE; row++) {
        let currentRun = [getTileAt(row, 0)];

        for (let col = 1; col < BOARD_SIZE; col++) {
          const currentTile = getTileAt(row, col);
          const previousTile = currentRun[currentRun.length - 1];

          if (getTileType(currentTile) && getTileType(currentTile) === getTileType(previousTile)) {
            currentRun.push(currentTile);
          } else {
            if (currentRun.length >= 3 && getTileType(previousTile)) {
              markMatchingRun(matches, currentRun);
            }

            currentRun = [currentTile];
          }
        }

        const lastTile = currentRun[currentRun.length - 1];
        if (currentRun.length >= 3 && getTileType(lastTile)) {
          markMatchingRun(matches, currentRun);
        }
      }

      for (let col = 0; col < BOARD_SIZE; col++) {
        let currentRun = [getTileAt(0, col)];

        for (let row = 1; row < BOARD_SIZE; row++) {
          const currentTile = getTileAt(row, col);
          const previousTile = currentRun[currentRun.length - 1];

          if (getTileType(currentTile) && getTileType(currentTile) === getTileType(previousTile)) {
            currentRun.push(currentTile);
          } else {
            if (currentRun.length >= 3 && getTileType(previousTile)) {
              markMatchingRun(matches, currentRun);
            }

            currentRun = [currentTile];
          }
        }

        const lastTile = currentRun[currentRun.length - 1];
        if (currentRun.length >= 3 && getTileType(lastTile)) {
          markMatchingRun(matches, currentRun);
        }
      }

      return matches;
    }

    function highlightMatches(matches) {
      matches.forEach((tile) => {
        tile.classList.add('matched');
      });
    }

    function removeMatches(matches) {
      matches.forEach((tile) => {
        tile.classList.remove('matched', 'selected');
        clearTile(tile);
      });
    }

    // Drop existing tile types into empty spaces, then create new random tiles above them.
    function collapseBoard() {
      const fallAnimations = [];

      for (let col = 0; col < BOARD_SIZE; col++) {
        const fallingTiles = [];

        for (let row = BOARD_SIZE - 1; row >= 0; row--) {
          const tile = getTileAt(row, col);
          const tileTypeId = getTileType(tile);

          if (tileTypeId) {
            fallingTiles.push({ tileTypeId, fromRow: row });
          }
        }

        for (let row = BOARD_SIZE - 1; row >= 0; row--) {
          const tile = getTileAt(row, col);
          const fallingTile = fallingTiles.shift();

          if (fallingTile) {
            const distance = row - fallingTile.fromRow;
            setTileType(tile, getTileTypeById(fallingTile.tileTypeId));
            queueFallAnimation(tile, distance, fallAnimations);
          } else {
            const spawnDistance = row + 1;
            setTileType(tile, getRandomTileType());
            queueFallAnimation(tile, spawnDistance, fallAnimations);
          }
        }
      }

      return fallAnimations;
    }

    function queueFallAnimation(tile, distance, fallAnimations) {
      if (distance <= 0) {
        tile.style.transform = '';
        tile.classList.remove('is-falling');
        return;
      }

      tile.classList.add('is-falling');
      tile.style.transform = `translateY(${-distance * tileStep}px)`;
      fallAnimations.push(tile);
    }

    async function playFallAnimations(fallAnimations) {
      if (!fallAnimations.length) {
        return;
      }

      // Force the browser to apply the starting transform before animating to rest.
      board.offsetHeight;
      fallAnimations.forEach((tile) => {
        tile.style.transform = '';
      });

      await wait(FALL_ANIMATION_DURATION);
      fallAnimations.forEach((tile) => {
        tile.classList.remove('is-falling');
      });
    }

    function doesMatchIncludeSwappedTile(matches, firstTile, secondTile) {
      return matches.has(firstTile) || matches.has(secondTile);
    }

    // Resolve matches until the board settles with no automatic chain reactions left.
    async function resolveMatches(startingMatches = findMatches()) {
      clearSelection();

      let matches = startingMatches;
      while (matches.size > 0) {
        console.log('Match Found!');
        highlightMatches(matches);
        await wait(MATCH_REMOVE_DELAY);
        addScore(matches.size);
        removeMatches(matches);
        await playFallAnimations(collapseBoard());
        matches = findMatches();
      }
    }

    // Move the two selected tiles toward each other and then swap their antique pieces.
    async function animateAndSwapTileTypes(firstTile, secondTile) {
      const firstRect = firstTile.getBoundingClientRect();
      const secondRect = secondTile.getBoundingClientRect();
      const moveX = secondRect.left - firstRect.left;
      const moveY = secondRect.top - firstRect.top;

      firstTile.classList.add('is-swapping');
      secondTile.classList.add('is-swapping');
      firstTile.style.transform = `translate(${moveX}px, ${moveY}px)`;
      secondTile.style.transform = `translate(${-moveX}px, ${-moveY}px)`;

      await wait(SWAP_ANIMATION_DURATION);

      const firstTileType = getTileTypeById(getTileType(firstTile));
      const secondTileType = getTileTypeById(getTileType(secondTile));
      setTileType(firstTile, secondTileType);
      setTileType(secondTile, firstTileType);
      firstTile.style.transform = '';
      secondTile.style.transform = '';
      firstTile.classList.remove('is-swapping');
      secondTile.classList.remove('is-swapping');
    }

    // Only allow swaps that create a match. Invalid moves briefly pause, then return.
    async function swapTileTypes(firstTile, secondTile) {
      isBoardBusy = true;
      setControlsDisabled(true);
      clearSelection();

      try {
        await animateAndSwapTileTypes(firstTile, secondTile);

        const matchesAfterSwap = findMatches();
        if (!doesMatchIncludeSwappedTile(matchesAfterSwap, firstTile, secondTile)) {
          await wait(INVALID_SWAP_RETURN_DELAY);
          await animateAndSwapTileTypes(firstTile, secondTile);
          return;
        }

        await resolveMatches(matchesAfterSwap);
      } finally {
        setControlsDisabled(false);
        isBoardBusy = false;
      }
    }

    board.addEventListener('click', (event) => {
      const clickedTile = event.target.closest('.tile');

      if (!clickedTile || !board.contains(clickedTile) || isBoardBusy) {
        return;
      }

      if (!selectedTile) {
        selectTile(clickedTile);
        return;
      }

      if (clickedTile === selectedTile) {
        clearSelection();
        return;
      }

      if (!areTilesAdjacent(selectedTile, clickedTile)) {
        clearSelection();
        return;
      }

      swapTileTypes(selectedTile, clickedTile);
    });

    async function settleBoard() {
      await resolveMatches();
    }

    newGameButton.addEventListener('click', startNewGame);

    startNewGame();
  </script>
</body>
</html>
